[project]
name = "card-digger-backend"
version = "0.1.0"
description = "Card Digger backend: domain model, Mercari adapter and collection policies"
requires-python = ">=3.11"
dependencies = [
  "mercapi @ git+https://github.com/mgmaru/mercapi.git@9c3a87aa963201a3a7d76ec23e5c9d9e09de7362",
  "fastapi>=0.141.1,<0.142",
  # Plain uvicorn, not uvicorn[standard]: the MVP binds to loopback for one
  # user and uses neither websockets nor uvloop. Reload is a development
  # convenience, so watchfiles sits in the dev extra instead.
  "uvicorn>=0.52.4,<0.53",
]

[project.optional-dependencies]
dev = [
  # pytest 9.0.3 fixes GHSA-6w46-j5rx-g56g, a predictable /tmp/pytest-of-{user}
  # path. pytest-asyncio 1.x is what supports pytest 9.
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "watchfiles>=1.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The marketplace client is pinned to a commit of the managed fork, which is a
# direct reference by design: a moving branch or a version range would change
# what runs without a review.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["card_digger"]

[tool.pytest.ini_options]
# Live acceptance verification (L4) is a manual activity and never a test.
# Only L2 and L3 live under tests/.
testpaths = ["tests"]
asyncio_mode = "auto"
