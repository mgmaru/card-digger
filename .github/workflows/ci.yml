name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only L1 to L3 of the test policy run here. Live acceptance verification (L4)
# reaches Mercari and must stay a manual, low frequency activity, so no job in
# this workflow may invoke a PoC runner such as run.py or auction_probe.py.
permissions:
  contents: read

jobs:
  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check relative links, anchors and code fences
        run: python tools/check_docs_links.py

  poc:
    name: PoC unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create the environment
        run: |
          uv venv --python 3.11 poc/mercapi/.venv
          uv pip install --python poc/mercapi/.venv/bin/python \
            -r poc/mercapi/requirements.txt

      - name: Run the unit tests
        run: |
          poc/mercapi/.venv/bin/python -m unittest discover \
            -s poc/mercapi -p 'test*.py' -v

  frontend:
    name: Frontend unit and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install the pinned dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Typecheck
        working-directory: src/frontend
        run: npm run typecheck

      - name: Run the unit and component tests
        working-directory: src/frontend
        run: npm run test

      - name: Build
        working-directory: src/frontend
        run: npm run build

      # Handed to the package job, which is the only one that reads it. This is
      # the one build the deploy uses: the package does not build again
      # (ADR 0003 issue 2, build once).
      - name: Keep the build for the package
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/frontend/dist/
          retention-days: 1
          if-no-files-found: error

  backend:
    name: Backend unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create the environment
        working-directory: src/backend
        run: uv sync --extra dev --frozen

      - name: Run the unit and contract tests
        working-directory: src/backend
        run: uv run --frozen pytest tests

  backend-windows:
    name: Backend unit and contract tests (Windows)
    # The same tests as `backend`, on the operating system the application is
    # deployed to (ADR 0003 issue 3). Python, and the packages that carry
    # machine code, are separate builds per operating system, so a pass on
    # Linux says nothing about them on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create the environment
        working-directory: src/backend
        run: uv sync --extra dev --frozen

      - name: Run the unit and contract tests
        working-directory: src/backend
        run: uv run --frozen pytest tests

  e2e:
    name: E2E acceptance flow
    runs-on: ubuntu-latest
    # Needs both halves, which is why it is one job rather than a step of the
    # other two. It reaches nothing outside: the backend it drives is
    # scripts/acceptance_app.py, wired to a marketplace in memory.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create the Python environment
        working-directory: src/backend
        run: uv sync --extra dev --frozen

      - name: Install the pinned dependencies
        working-directory: src/frontend
        run: npm ci

      # Chromium only. The decision and what it costs are in the TODO under
      # Phase 1-5; adding a browser here is a line in playwright.config.ts.
      - name: Install Chromium
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Run the acceptance flow
        working-directory: src/frontend
        run: npm run e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: src/frontend/test-results/
          retention-days: 7

  package:
    name: Deploy package
    # What the deploy on the Windows machine takes (ADR 0003 issues 2 and 7):
    # the frontend build, the backend source and uv.lock of one commit, in one
    # file with one hash. It needs every other job, so a package exists only
    # for a commit CI passed. It deploys nothing: the Windows machine fetches
    # it, by hand, when its owner runs the deploy.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [docs, poc, frontend, backend, backend-windows, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Take the frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Assemble the package
        run: |
          name="card-digger-${GITHUB_SHA}"
          mkdir -p "out/${name}"
          # Only what git tracks, at this commit. Nothing the runner made.
          git archive --format=tar HEAD src/backend | tar -x -C "out/${name}"
          cp -R frontend-dist "out/${name}/dist"
          printf '{"commit":"%s","runId":"%s","builtAt":"%s"}\n' \
            "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "out/${name}/manifest.json"
          (cd out && zip -qr "${name}.zip" "${name}")
          (cd out && sha256sum "${name}.zip" > "${name}.zip.sha256")
          cat "out/${name}.zip.sha256"

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package-${{ github.sha }}
          path: |
            out/card-digger-${{ github.sha }}.zip
            out/card-digger-${{ github.sha }}.zip.sha256
          retention-days: 90
          # Already a zip. Compressing it again buys nothing.
          compression-level: 0
          if-no-files-found: error

