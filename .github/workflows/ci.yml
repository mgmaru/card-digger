name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only L1 to L3 of the test policy run here. Live acceptance verification (L4)
# reaches Mercari and must stay a manual, low frequency activity, so no job in
# this workflow may invoke a PoC runner such as run.py or auction_probe.py.
permissions:
  contents: read

jobs:
  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check relative links, anchors and code fences
        run: python tools/check_docs_links.py

  poc:
    name: PoC unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create the environment
        run: |
          uv venv --python 3.11 poc/mercapi/.venv
          uv pip install --python poc/mercapi/.venv/bin/python \
            -r poc/mercapi/requirements.txt

      - name: Run the unit tests
        run: |
          poc/mercapi/.venv/bin/python -m unittest discover \
            -s poc/mercapi -p 'test*.py' -v

  frontend:
    name: Frontend unit and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install the pinned dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Typecheck
        working-directory: src/frontend
        run: npm run typecheck

      - name: Run the unit and component tests
        working-directory: src/frontend
        run: npm run test

      - name: Build
        working-directory: src/frontend
        run: npm run build

  backend:
    name: Backend unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create the environment
        working-directory: src/backend
        run: uv sync --extra dev --frozen

      - name: Run the unit and contract tests
        working-directory: src/backend
        run: uv run --frozen pytest tests
