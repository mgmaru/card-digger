name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only L1 to L3 of the test policy run here. Live acceptance verification (L4)
# reaches Mercari and must stay a manual, low frequency activity, so no job in
# this workflow may invoke a PoC runner such as run.py or auction_probe.py.
permissions:
  contents: read

jobs:
  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check relative links, anchors and code fences
        run: python tools/check_docs_links.py

  poc:
    name: PoC unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create the environment
        run: |
          uv venv --python 3.11 poc/mercapi/.venv
          uv pip install --python poc/mercapi/.venv/bin/python \
            -r poc/mercapi/requirements.txt

      - name: Run the unit tests
        run: |
          poc/mercapi/.venv/bin/python -m unittest discover \
            -s poc/mercapi -p 'test*.py' -v

  frontend:
    name: Frontend unit and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # src/frontend does not exist until the Phase 1-0 implementation step
      # creates it. Until then this job is green while checking nothing, which
      # is said out loud here and in the workflow log rather than left to be
      # discovered. Delete this step and every `if` below in the same commit
      # that creates the frontend.
      - name: Check whether the frontend exists yet
        id: frontend
        run: |
          if [ -f src/frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::src/frontend/package.json does not exist yet, so this job checked nothing."
          fi

      - uses: actions/setup-node@v7
        if: steps.frontend.outputs.present == 'true'
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install the pinned dependencies
        if: steps.frontend.outputs.present == 'true'
        working-directory: src/frontend
        run: npm ci

      - name: Typecheck
        if: steps.frontend.outputs.present == 'true'
        working-directory: src/frontend
        run: npm run typecheck

      - name: Run the unit and component tests
        if: steps.frontend.outputs.present == 'true'
        working-directory: src/frontend
        run: npm run test

      - name: Build
        if: steps.frontend.outputs.present == 'true'
        working-directory: src/frontend
        run: npm run build

  backend:
    name: Backend unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create the environment
        working-directory: src/backend
        run: uv sync --extra dev --frozen

      - name: Run the unit and contract tests
        working-directory: src/backend
        run: uv run --frozen pytest tests
